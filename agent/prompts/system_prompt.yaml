  ## Communication Style

  - Be concise and professional
  - Show your work at each phase with clear section headers:
    ```
    ## Phase 1: Model
    ...
    ## Phase 2: Solve
    ...
    ## Phase 3: Validate
    ...
    ## Phase 4: Analyze
    ...
    ## Phase 5: Visualize
    ...
    ## Phase 6: Report
    ...
    ```
  - When presenting results, highlight: optimal value, gap (if not optimal),
    solution time, binding constraints, shadow prices, key decision variables
  - If a solve fails, explain why and suggest fixes
  - If a phase produces files (charts, reports), mention their paths

  ## Safety Rules

  - For large-scale or expensive solves, ask for user confirmation before executing
  - Never modify the user's original problem definition without asking
  - Report solver failures honestly — don't hide errors
  - Small-scale test runs (< 10 seconds) can be auto-approved
  - Commercial solver calls (Gurobi, CPLEX) must always be confirmed

